<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千年一脉 - 基于知识图谱的中国历史探索系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rice-white: #F8F6F2;
            --ink-black: #2C2C2C;
            --dai-blue: #355C5A;
            --vermillion: #C34739;
            --light-gold: #D8B26A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            background-color: var(--rice-white);
            color: var(--ink-black);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-serif {
            font-family: 'Noto Serif SC', 'STSong', serif;
        }

        .paper-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-blend-mode: overlay;
            opacity: 0.03;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
        }

        .glass-card-dark {
            background: rgba(44, 44, 44, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hover-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .hover-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(44, 44, 44, 0.1);
        }

        .horizontal-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-up {
            animation: fadeUp 0.6s ease-out forwards;
        }

        .fade-up-delay-1 { animation-delay: 0.1s; }
        .fade-up-delay-2 { animation-delay: 0.2s; }
        .fade-up-delay-3 { animation-delay: 0.3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 2rem;
        }

        header .container {
            max-width: 7xl;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.25rem;
            color: var(--ink-black);
            letter-spacing: 0.3em;
        }

        nav {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
            color: rgba(44, 44, 44, 0.7);
        }

        nav span {
            cursor: pointer;
            transition: color 0.2s;
        }

        nav span:hover, nav span.active {
            color: var(--dai-blue);
        }

        .hero-section {
            padding: 8rem 2rem 6rem;
            text-align: center;
        }

        .hero-section .container {
            max-width: 5xl;
            margin: 0 auto;
        }

        .hero-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 4rem;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            opacity: 0;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            color: rgba(44, 44, 44, 0.6);
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            opacity: 0;
        }

        .explore-cards {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 4rem;
            opacity: 0;
        }

        .explore-card {
            width: 18rem;
            height: 12rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .explore-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .explore-icon.blue {
            background: rgba(53, 92, 90, 0.1);
        }

        .explore-icon.red {
            background: rgba(195, 71, 57, 0.1);
        }

        .explore-icon svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        .explore-card-title {
            font-weight: 500;
            color: var(--ink-black);
        }

        .explore-card-desc {
            font-size: 0.875rem;
            color: rgba(44, 44, 44, 0.5);
        }

        .search-box {
            max-width: 24rem;
            margin: 4rem auto 0;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            opacity: 0;
        }

        .search-box svg {
            width: 1.25rem;
            height: 1.25rem;
            color: rgba(44, 44, 44, 0.4);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.875rem;
            color: rgba(44, 44, 44, 0.8);
        }

        .search-box input::placeholder {
            color: rgba(44, 44, 44, 0.4);
        }

        .search-btn {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: rgba(53, 92, 90, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: rgba(53, 92, 90, 0.2);
        }

        .search-btn svg {
            width: 1rem;
            height: 1rem;
            color: var(--dai-blue);
        }

        .continue-section {
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.3);
        }

        .continue-section .container {
            max-width: 7xl;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-subtitle {
            font-size: 0.75rem;
            color: var(--dai-blue);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            color: var(--ink-black);
            margin-top: 0.5rem;
        }

        .continue-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .continue-card {
            padding: 1.5rem;
        }

        .continue-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .continue-card-label {
            font-size: 0.625rem;
            color: var(--vermillion);
            font-weight: 500;
            letter-spacing: 0.1em;
        }

        .continue-card-date {
            font-size: 0.625rem;
            color: rgba(44, 44, 44, 0.4);
        }

        .continue-card-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.25rem;
            color: var(--ink-black);
            margin-bottom: 0.5rem;
        }

        .continue-card-desc {
            font-size: 0.75rem;
            color: rgba(44, 44, 44, 0.6);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hot-persons {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .person-item {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .person-avatar {
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            background: rgba(44, 44, 44, 0.05);
            overflow: hidden;
            transition: all 0.2s;
        }

        .person-item:hover .person-avatar {
            outline: 2px solid rgba(53, 92, 90, 0.5);
        }

        .person-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .person-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--ink-black);
        }

        .person-dynasty {
            font-size: 0.625rem;
            color: rgba(44, 44, 44, 0.5);
        }

        .recommendations {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .recommend-item {
            display: flex;
            gap: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .recommend-item:hover {
            opacity: 0.7;
        }

        .recommend-thumb {
            width: 3rem;
            height: 2rem;
            border-radius: 0.5rem;
            background: rgba(44, 44, 44, 0.05);
            overflow: hidden;
            flex-shrink: 0;
        }

        .recommend-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recommend-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .recommend-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--ink-black);
        }

        .recommend-desc {
            font-size: 0.625rem;
            color: rgba(44, 44, 44, 0.5);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            z-index: 100;
        }

        footer .container {
            max-width: 4xl;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            color: white;
        }

        .nav-item svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .nav-item span {
            font-size: 0.625rem;
        }

        .nav-item.active svg {
            color: var(--dai-blue);
        }

        .nav-item.active span {
            color: var(--dai-blue);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .explore-cards {
                flex-direction: column;
                align-items: center;
            }

            .continue-grid {
                grid-template-columns: 1fr;
            }

            .nav {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="paper-texture"></div>

    <header>
        <div class="container">
            <div class="logo">千年一脉</div>
            <nav>
                <span class="active">首页</span>
                <span>中国历史</span>
                <span>我的家族</span>
                <span>我的</span>
            </nav>
        </div>
    </header>

    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title font-serif" id="hero-title">千年一脉</h1>
            <p class="hero-subtitle" id="hero-sub1">在历史中看见家族</p>
            <p class="hero-subtitle" id="hero-sub2">在家族中看见历史</p>
            
            <div class="explore-cards" id="explore-cards">
                <div class="glass-card hover-card explore-card" onclick="window.location.href='dynasty.html'">
                    <div class="explore-icon blue">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #355C5A;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <span class="explore-card-title">浏览中国历史</span>
                    <span class="explore-card-desc">时间轴探索</span>
                </div>
                
                <div class="glass-card hover-card explore-card">
                    <div class="explore-icon red">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #C34739;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <span class="explore-card-title">浏览我的家族</span>
                    <span class="explore-card-desc">家谱探索</span>
                </div>
            </div>

            <div class="glass-card search-box" id="search-box">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" placeholder="搜索人物、历史事件、朝代……">
                <div class="search-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <section class="continue-section">
        <div class="container">
            <div class="section-header">
                <span class="section-subtitle">Continue Exploring</span>
                <h2 class="section-title">继续探索</h2>
            </div>
            
            <div class="continue-grid">
                <div class="glass-card continue-card hover-card">
                    <div class="continue-card-header">
                        <span class="continue-card-label">今日历史</span>
                        <span class="continue-card-date">627年的今天</span>
                    </div>
                    <h3 class="continue-card-title">贞观之治</h3>
                    <p class="continue-card-desc">唐太宗李世民统治时期出现的政治清明、经济繁荣的局面。</p>
                </div>

                <div class="glass-card continue-card">
                    <div class="continue-card-header">
                        <span class="continue-card-label">热门人物</span>
                    </div>
                    <div class="hot-persons horizontal-scroll">
                        <div class="person-item">
                            <div class="person-avatar">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Li_Bai.jpg/220px-Li_Bai.jpg" alt="李白">
                            </div>
                            <span class="person-name">李白</span>
                            <span class="person-dynasty">唐朝</span>
                        </div>
                        <div class="person-item">
                            <div class="person-avatar">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Du_Fu.jpg/220px-Du_Fu.jpg" alt="杜甫">
                            </div>
                            <span class="person-name">杜甫</span>
                            <span class="person-dynasty">唐朝</span>
                        </div>
                        <div class="person-item">
                            <div class="person-avatar">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Wu_Zetian.jpg/220px-Wu_Zetian.jpg" alt="武则天">
                            </div>
                            <span class="person-name">武则天</span>
                            <span class="person-dynasty">唐朝</span>
                        </div>
                        <div class="person-item">
                            <div class="person-avatar">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Tang_Taizong.jpg/220px-Tang_Taizong.jpg" alt="李世民">
                            </div>
                            <span class="person-name">李世民</span>
                            <span class="person-dynasty">唐朝</span>
                        </div>
                    </div>
                </div>

                <div class="glass-card continue-card">
                    <div class="continue-card-header">
                        <span class="continue-card-label">为你推荐</span>
                    </div>
                    <div class="recommendations">
                        <div class="recommend-item">
                            <div class="recommend-thumb">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/An_Lushan_Rebellion.jpg/400px-An_Lushan_Rebellion.jpg" alt="安史之乱">
                            </div>
                            <div class="recommend-info">
                                <span class="recommend-title">安史之乱</span>
                                <span class="recommend-desc">唐朝由盛转衰的关键事件</span>
                            </div>
                        </div>
                        <div class="recommend-item">
                            <div class="recommend-thumb">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Silk_Road_Map.png/400px-Silk_Road_Map.png" alt="丝绸之路">
                            </div>
                            <div class="recommend-info">
                                <span class="recommend-title">丝绸之路</span>
                                <span class="recommend-desc">连接东西方文明的古老商路</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="glass-card-dark">
        <div class="container">
            <div class="nav-item active">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span>首页</span>
            </div>
            <div class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span>中国历史</span>
            </div>
            <div class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <span>我的家族</span>
            </div>
            <div class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span>我的</span>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                document.getElementById('hero-title').style.opacity = '1';
                document.getElementById('hero-title').style.animation = 'fadeUp 0.6s ease-out forwards';
            }, 100);

            setTimeout(function() {
                document.getElementById('hero-sub1').style.opacity = '1';
                document.getElementById('hero-sub1').style.animation = 'fadeUp 0.6s ease-out forwards';
            }, 200);

            setTimeout(function() {
                document.getElementById('hero-sub2').style.opacity = '1';
                document.getElementById('hero-sub2').style.animation = 'fadeUp 0.6s ease-out forwards';
            }, 300);

            setTimeout(function() {
                document.getElementById('explore-cards').style.opacity = '1';
                document.getElementById('explore-cards').style.animation = 'fadeUp 0.6s ease-out forwards';
            }, 400);

            setTimeout(function() {
                document.getElementById('search-box').style.opacity = '1';
                document.getElementById('search-box').style.animation = 'fadeUp 0.6s ease-out forwards';
            }, 500);
        });
    </script>
</body>
</html>
